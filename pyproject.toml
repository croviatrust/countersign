[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "countersign"
version = "0.1.0"
description = "Independent witnessing for AI agent evidence: append-only Merkle log, signed tree heads, offline-verifiable proofs."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Tarik En Nakhai" }]
keywords = [
  "ai-agents", "audit", "transparency-log", "merkle", "ed25519",
  "certificate-transparency", "evidence", "witness", "mcp", "compliance",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Security :: Cryptography",
]
dependencies = ["cryptography>=42.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
countersign = "countersign.cli:main"

[project.urls]
Homepage = "https://croviatrust.com"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501"]  # long lines allowed in docstrings/messages

[tool.mypy]
python_version = "3.10"
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
