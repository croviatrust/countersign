name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"

jobs:
  tacet:
    name: TACET reference, tests and conformance
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Crovia Seal reference (for the Seal wrapper)
        run: |
          git clone --depth 1 https://github.com/croviatrust/crovia-seal /tmp/crovia-seal
          pip install -e /tmp/crovia-seal/reference/python
      - name: Install TACET reference
        run: pip install -e "tacet/reference/python[test]"
      - name: Unit tests
        working-directory: tacet/reference/python
        run: python -m pytest -q
      - name: Conformance
        run: python tacet/conformance/run_conformance.py
      - name: Vectors are deterministic
        run: |
          python tacet/conformance/generate_vectors.py
          git diff --exit-code -- tacet/conformance/vectors
      - name: Operator (predicate vectors, fake-network epoch, proof round-trip)
        run: |
          pip install -e "tacet/operator[test]"
          python -m pytest -q tacet/operator/tests
      - name: Predicate hash is stable
        run: |
          python - <<'EOF'
          from tacet_operator.predicates import load
          _, v, h = load("crovia.pred.hf-card-training-data")
          print("crovia.pred.hf-card-training-data", v, "sha256:" + h.hex())
          EOF

  canon:
    name: Canon and Phase 0 scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: canon.json is valid and lists every canon path once
        run: |
          python - <<'EOF'
          import json
          c = json.load(open("canon/canon.json"))
          assert c["schema"] == "crovia.canon.v1"
          for key in ("pages", "retired_paths", "data_files", "private_files", "heavy_files"):
              assert len(c[key]) == len(set(c[key])), f"duplicates in {key}"
          assert not set(c["pages"]) & set(c["retired_paths"])
          assert not set(c["data_files"]) & set(c["private_files"])
          print("canon ok")
          EOF
      - name: Scripts compile
        run: |
          python -m py_compile tools/audit_surfaces.py
          shopt -s nullglob
          for f in ops/phase0/*.py; do python -m py_compile "$f"; done
          for f in ops/phase0/*.sh site/deploy.sh; do bash -n "$f"; done
          python - <<'EOF'
          import json, pathlib
          for f in pathlib.Path("site").rglob("*.json"):
              json.loads(f.read_text())
          print("site json ok")
          EOF

  surface-audit:
    name: Live surface audit (report only)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/audit_surfaces.py --out /tmp/reports
      - uses: actions/upload-artifact@v4
        with:
          name: surface-audit
          path: /tmp/reports
