name: release-tacet

# Publishes the TACET packages on a tacet-vX.Y.Z tag:
#   tacet/reference/python  -> PyPI  crovia-tacet
#   tacet/operator          -> PyPI  crovia-tacet-operator
# via PyPI Trusted Publishing (OIDC). No token is stored in this repository.
#
# One-time setup by a maintainer on pypi.org, for each of the two projects:
#   Publishing -> add GitHub publisher: owner croviatrust, repository countersign,
#   workflow release-tacet.yml, environment pypi.
# And on GitHub: Settings -> Environments -> "pypi"; then set the repository variable
#   PYPI_TRUSTED_PUBLISHER=configured   (until then the publish job is skipped, not failed).
#
# Cut a release: bump both pyproject.toml files, tacet/__init__.py and wrap.py TACET_VERSION,
# regenerate vectors, then  git tag -a tacet-vX.Y.Z && git push origin main --tags

on:
  push:
    tags:
      - "tacet-v*"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches the package versions
        run: |
          TAG="${GITHUB_REF_NAME#tacet-v}"
          REF=$(python3 -c "import tomllib;print(tomllib.load(open('tacet/reference/python/pyproject.toml','rb'))['project']['version'])")
          OP=$(python3 -c "import tomllib;print(tomllib.load(open('tacet/operator/pyproject.toml','rb'))['project']['version'])")
          INIT=$(python3 -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('tacet/reference/python/tacet/__init__.py').read()).group(1))")
          echo "tag=$TAG reference=$REF operator=$OP __version__=$INIT"
          test "$TAG" = "$REF" && test "$TAG" = "$OP" && test "$TAG" = "$INIT"
      - name: Tests and conformance
        run: |
          git clone --depth 1 https://github.com/croviatrust/crovia-seal /tmp/crovia-seal
          pip install -e /tmp/crovia-seal/reference/python -e "tacet/reference/python[test]" -e "tacet/operator[test]"
          (cd tacet/reference/python && python -m pytest -q)
          python -m pytest -q tacet/operator/tests
          python tacet/conformance/run_conformance.py
          node tacet/conformance/run_conformance_js.cjs

  publish:
    needs: check
    if: vars.PYPI_TRUSTED_PUBLISHER == 'configured'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        package: [tacet/reference/python, tacet/operator]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build
        working-directory: ${{ matrix.package }}
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ matrix.package }}/dist/
          print-hash: true
